<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BRASIL RP — Protótipo 3D</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87b8df;font-family:Arial,Helvetica,sans-serif;touch-action:none}
  #game{position:fixed;inset:0}
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #000}
  .top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .brand{background:#101820d9;border:1px solid #ffffff30;border-radius:12px;padding:9px 12px;font-weight:800;letter-spacing:.7px}
  .brand small{display:block;font-size:10px;font-weight:500;opacity:.8;margin-top:3px;letter-spacing:0}
  .status{background:#101820d9;border:1px solid #ffffff30;border-radius:12px;padding:9px 12px;font-size:12px;text-align:right}
  #help{position:absolute;top:76px;left:12px;background:#101820b8;padding:8px 10px;border-radius:9px;font-size:11px;max-width:210px;line-height:1.4}
  #controls{position:absolute;inset:auto 0 18px 0;display:flex;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}
  #stick{width:124px;height:124px;border-radius:50%;background:#14202b70;border:2px solid #ffffff80;position:relative;pointer-events:auto;touch-action:none}
  #nub{width:48px;height:48px;border-radius:50%;background:#ffffffbd;border:2px solid #263746;position:absolute;left:36px;top:36px}
  .actions{display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:auto}
  .actionrow{display:flex;gap:9px}
  .btn{border:1px solid #ffffffa0;border-radius:50%;width:62px;height:62px;background:#14202bd9;color:white;font-weight:800;font-size:12px;box-shadow:0 3px 10px #0005}
  .btn:active{background:#16834c}
  #toast{position:absolute;bottom:154px;left:50%;transform:translateX(-50%);background:#101820e8;padding:9px 14px;border-radius:10px;font-size:12px;opacity:0;transition:opacity .2s;white-space:nowrap}
  #foot{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:10px;opacity:.8;white-space:nowrap}
  @media (min-width:800px){#controls{padding:0 30px 16px}#help{font-size:12px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div class="top">
    <div class="brand">🇧🇷 BRASIL RP <small>NOVA PARAÍBA • TESTE 3D</small></div>
    <div class="status">ONLINE: <b>1</b><br><span id="coords">Explorando a cidade</span></div>
  </div>
  <div id="help">Explore a cidade usando o controle na tela.<br>No computador: WASD ou setas para andar.</div>
  <div id="controls">
    <div id="stick"><div id="nub"></div></div>
    <div class="actions">
      <div class="actionrow">
        <button class="btn" id="jump">PULAR</button>
        <button class="btn" id="run">CORRER</button>
      </div>
      <button class="btn" id="interact">AÇÃO</button>
    </div>
  </div>
  <div id="toast">Bem-vindo à Nova Paraíba!</div>
  <div id="foot">Protótipo inicial • Projeto em desenvolvimento</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
  const root=document.getElementById('game');
  if(!window.THREE){root.innerHTML='<div style="padding:24px;color:white">Não foi possível carregar o motor 3D. Verifique sua conexão com a internet e atualize a página.</div>';return;}
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x91c6ed);
  scene.fog=new THREE.Fog(0x91c6ed,65,180);
  const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,400);
  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  root.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xdff2ff,0x65734c,2.0));
  const sun=new THREE.DirectionalLight(0xfff0d2,2.2);
  sun.position.set(-35,60,25);sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left=-90;sun.shadow.camera.right=90;sun.shadow.camera.top=90;sun.shadow.camera.bottom=-90;
  scene.add(sun);

  const mat=(color,roughness=1)=>new THREE.MeshStandardMaterial({color,roughness});
  const grass=mat(0x6caa62), asphalt=mat(0x343b42), sidewalk=mat(0xbdb9a9), white=mat(0xf2eee1);
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(240,240),grass);ground.rotation.x=-Math.PI/2;ground.position.y=-.08;ground.receiveShadow=true;scene.add(ground);

  function box(w,h,d,m,x,y,z,cast=true){
    const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=cast;o.receiveShadow=true;scene.add(o);return o;
  }
  // Ruas principais em cruz
  box(240,.08,18,asphalt,0,0,0,false);
  box(18,.08,240,asphalt,0,.01,0,false);
  // Calçadas e marcações
  for(let s of [-1,1]){
    box(240,.12,3,sidewalk,0,.04,s*10.8,false);
    box(3,.12,240,sidewalk,s*10.8,.04,0,false);
  }
  const stripe=mat(0xe8d99a);
  for(let i=-105;i<=105;i+=12){
    box(5,.025,.22,stripe,i,.06,0,false);
    box(.22,.025,5,stripe,0,.07,i,false);
  }
  // Faixas de pedestres
  for(let k=0;k<7;k++){box(1.1,.035,7,white,-7.2+k*2.1,.08,12,false);box(7,.035,1.1,white,12,.08,-7.2+k*2.1,false);}

  // Praça central
  const plaza=mat(0xd7cdb8), plazaTile=mat(0xc4b99f);
  box(34,.18,30,plaza,-33,.08,-31,false);
  for(let x=-47;x<=-21;x+=4)for(let z=-43;z<=-19;z+=4)box(3.8,.025,3.8,plazaTile,x,.19,z,false);
  // Coreto
  const pillar=mat(0xf2e8d1), roof=mat(0x9b3f32);
  for(const [x,z] of [[-39,-37],[-27,-37],[-39,-25],[-27,-25]])box(.55,4,.55,pillar,x,2.2,z);
  box(15,.35,15,roof,-33,4.35,-31);
  const roofTop=new THREE.Mesh(new THREE.ConeGeometry(10,3,4),roof);roofTop.position.set(-33,6,-31);roofTop.rotation.y=Math.PI/4;roofTop.castShadow=true;scene.add(roofTop);
  // bancos
  const wood=mat(0x805332);
  for(let i=0;i<4;i++){box(4,.25,.7,wood,-46+i*8,.55,-17);box(.25,1.2,.25,wood,-47+i*8,.1,-17);box(.25,1.2,.25,wood,-44+i*8,.1,-17);}

  // Árvores simples
  const trunk=mat(0x70462b), leaves=mat(0x287b43);
  function tree(x,z,s=1){
    const t=new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.32*s,2.5*s,7),trunk);t.position.set(x,1.25*s,z);t.castShadow=true;scene.add(t);
    const crown=new THREE.Mesh(new THREE.SphereGeometry(1.65*s,9,7),leaves);crown.position.set(x,3.2*s,z);crown.castShadow=true;scene.add(crown);
  }
  [[-51,-47],[-16,-47],[-51,-14],[-16,-14],[22,22],[25,-23],[-24,30],[-55,25],[48,-45],[53,40],[-75,8],[75,-8]].forEach(p=>tree(p[0],p[1],.85+Math.random()*.35));

  // Prédios e casas coloridas nos quarteirões
  const wallColors=[0xe7c58f,0xd98d72,0xe7dfc7,0xb9d0c8,0xd6b6d8,0xd9d7a5];
  function building(x,z,w,d,h,color,kind='house'){
    const wall=mat(color), roofMat=mat(kind==='shop'?0x4b5962:0x914e3d);
    box(w,h,d,wall,x,h/2,z);
    box(w+.35,.35,d+.35,roofMat,x,h+.17,z);
    const door=mat(0x563c2d),glass=mat(0x8fc5d8,.35);
    box(.95,2,.12,door,x,1,z+d/2+.07,false);
    for(let wx of [-w*.27,w*.27]){box(1.15,1,.12,glass,x+wx, h*.62,z+d/2+.08,false);box(1.25,.12,.16,white,x+wx,h*.62+.56,z+d/2+.1,false);}
    if(kind==='shop'){
      box(w*.8,.55,.22,mat(0x1c5a88),x,h*.77,z+d/2+.2,false);
      const sign=new THREE.Mesh(new THREE.BoxGeometry(w*.8,.55,.08),mat(0x1c5a88));sign.position.set(x,h*.77,z+d/2+.32);scene.add(sign);
    }
  }
  const blocks=[
    [-36,24,15,13,8,'shop'],[-58,25,13,12,7,'house'],[-76,24,13,13,9,'house'],
    [34,28,15,13,10,'shop'],[57,28,13,13,7,'house'],[77,27,13,13,8,'house'],
    [-37,-68,15,13,9,'house'],[-59,-69,13,13,7,'house'],[-80,-69,13,13,8,'house'],
    [34,-65,15,13,10,'shop'],[57,-65,13,13,8,'house'],[79,-65,13,13,7,'house'],
    [-92,-25,12,15,7,'house'],[93,22,13,14,8,'house']
  ];
  blocks.forEach((b,i)=>building(...b.slice(0,5),wallColors[i%wallColors.length],b[5]));
  // Posto de gasolina estilizado
  const stationBlue=mat(0x17618c), pumpRed=mat(0xd84636);
  box(22,.25,15,white,38,-3,.2);
  box(22,.35,15,stationBlue,38,5,-7);
  for(let x of [32,39,46]){box(.9,2,.9,pumpRed,x,1,-1);box(1.1,.3,.9,white,x,2.1,-1);}
  // Delegacia com placa
  building(-92,42,18,15,9,0xd9dedf,'shop');

  // Veículos decorativos
  const carRed=mat(0xb92f2f),carBlue=mat(0x28658c),tire=mat(0x17191c),windowMat=mat(0x9fc8d5,.35);
  function car(x,z,color,rot=0){
    const g=new THREE.Group();
    const base=new THREE.Mesh(new THREE.BoxGeometry(4.5,1.05,2.05),color);base.position.y=.85;base.castShadow=true;g.add(base);
    const cabin=new THREE.Mesh(new THREE.BoxGeometry(2.3,.95,1.7),windowMat);cabin.position.set(-.25,1.75,0);cabin.castShadow=true;g.add(cabin);
    for(const wx of [-1.45,1.45])for(const wz of [-1,1]){
      const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.25,12),tire);wheel.rotation.x=Math.PI/2;wheel.position.set(wx,.48,wz);g.add(wheel);
    }
    g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);
  }
  car(-5,17,carRed,Math.PI/2);car(18,-5,carBlue,0);car(62,5,carRed,Math.PI/2);

  // Jogador estilizado
  const player=new THREE.Group();scene.add(player);
  const skin=mat(0xb87950),shirt=mat(0x176b47),pants=mat(0x26384e),hair=mat(0x29221e);
  const torso=new THREE.Mesh(new THREE.CylinderGeometry(.48,.58,1.25,10),shirt);torso.position.y=1.55;torso.castShadow=true;player.add(torso);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.38,12,10),skin);head.position.y=2.45;head.castShadow=true;player.add(head);
  const haircap=new THREE.Mesh(new THREE.SphereGeometry(.39,12,8,0,Math.PI*2,0,Math.PI*.55),hair);haircap.position.y=2.53;player.add(haircap);
  for(let x of [-.22,.22]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.32,.85,.36),pants);leg.position.set(x,.55,0);leg.castShadow=true;player.add(leg);}
  const armMat=shirt;
  for(let x of [-.62,.62]){const arm=new THREE.Mesh(new THREE.CylinderGeometry(.16,.2,.9,8),armMat);arm.position.set(x,1.58,0);arm.rotation.z=x<0?-.18:.18;arm.castShadow=true;player.add(arm);}
  player.position.set(0,0,5);

  let moveX=0,moveY=0,running=false,vy=0,onGround=true;
  const keys={};
  addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();});
  addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
  const stick=document.getElementById('stick'),nub=document.getElementById('nub');
  let pointer=null;
  function setStick(e){
    const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    let dx=e.clientX-cx,dy=e.clientY-cy;const max=39,len=Math.hypot(dx,dy);
    if(len>max){dx=dx/len*max;dy=dy/len*max;}
    nub.style.left=(36+dx)+'px';nub.style.top=(36+dy)+'px';
    moveX=dx/max;moveY=dy/max;
  }
  stick.addEventListener('pointerdown',e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);setStick(e);});
  stick.addEventListener('pointermove',e=>{if(pointer===e.pointerId)setStick(e);});
  function resetStick(){pointer=null;moveX=moveY=0;nub.style.left='36px';nub.style.top='36px';}
  stick.addEventListener('pointerup',resetStick);stick.addEventListener('pointercancel',resetStick);
  document.getElementById('run').addEventListener('pointerdown',()=>running=true);
  document.getElementById('run').addEventListener('pointerup',()=>running=false);
  document.getElementById('run').addEventListener('pointercancel',()=>running=false);
  document.getElementById('jump').addEventListener('click',()=>{if(onGround){vy=7;onGround=false;}});
  let toastTimer;
  function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.opacity=0,2200);}
  document.getElementById('interact').addEventListener('click',()=>{
    const p=player.position;
    if(Math.hypot(p.x+33,p.z+31)<18)toast('Você está na praça central!');
    else if(Math.hypot(p.x-38,p.z+3)<18)toast('Posto de gasolina — em breve!');
    else toast('Nenhuma interação disponível por aqui ainda.');
  });

  const clock=new THREE.Clock();
  const camTarget=new THREE.Vector3();
  function animate(){
    requestAnimationFrame(animate);
    const dt=Math.min(clock.getDelta(),.04);
    let ix=moveX,iz=moveY;
    if(keys.w||keys.arrowup)iz-=1;if(keys.s||keys.arrowdown)iz+=1;
    if(keys.a||keys.arrowleft)ix-=1;if(keys.d||keys.arrowright)ix+=1;
    const len=Math.hypot(ix,iz);if(len>1){ix/=len;iz/=len;}
    const speed=(running?10:5.5)*dt;
    if(len>.05){
      player.position.x+=ix*speed;
      player.position.z+=iz*speed;
      player.rotation.y=Math.atan2(ix,iz);
    }
    vy-=18*dt;player.position.y+=vy*dt;
    if(player.position.y<=0){player.position.y=0;vy=0;onGround=true;}
    player.position.x=THREE.MathUtils.clamp(player.position.x,-108,108);
    player.position.z=THREE.MathUtils.clamp(player.position.z,-108,108);
    camTarget.set(player.position.x,2.2,player.position.z);
    const behind=new THREE.Vector3(0,6,11).applyAxisAngle(new THREE.Vector3(0,1,0),player.rotation.y);
    camera.position.lerp(new THREE.Vector3(player.position.x+behind.x,player.position.y+behind.y,player.position.z+behind.z),1-Math.pow(.001,dt));
    camera.lookAt(camTarget);
    document.getElementById('coords').textContent=`X ${Math.round(player.position.x)} • Z ${Math.round(player.position.z)}`;
    renderer.render(scene,camera);
  }
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
  camera.position.set(0,7,16);camera.lookAt(0,1,5);
  toast('Bem-vindo à Nova Paraíba!');
  animate();
})();
</script>
</body>
</html>
