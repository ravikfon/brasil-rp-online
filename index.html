<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BRASIL RP - Nova Paraíba</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #87ceeb;
  touch-action: none;
}
canvas { display: block; }

#hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  color: white;
  text-shadow: 1px 2px 3px #000;
}
#logo {
  position: absolute;
  top: 14px;
  left: 14px;
  font-size: 19px;
  font-weight: bold;
  color: #ffe45c;
}
#location {
  position: absolute;
  top: 42px;
  left: 14px;
  font-size: 12px;
}
#status {
  position: absolute;
  top: 14px;
  right: 14px;
  text-align: right;
  font-size: 12px;
}
#message {
  position: absolute;
  top: 75px;
  left: 50%;
  transform: translateX(-50%);
  background: #111b;
  padding: 9px 14px;
  border-radius: 8px;
  font-size: 13px;
  white-space: nowrap;
}
#controls {
  position: absolute;
  inset: 0;
}
#joystick {
  position: absolute;
  left: 25px;
  bottom: 35px;
  width: 125px;
  height: 125px;
  border-radius: 50%;
  background: #ffffff35;
  border: 2px solid #ffffff80;
  pointer-events: auto;
  touch-action: none;
}
#stick {
  position: absolute;
  width: 48px;
  height: 48px;
  left: 36px;
  top: 36px;
  border-radius: 50%;
  background: #ffffffbb;
  box-shadow: 0 2px 8px #0008;
}
.action {
  position: absolute;
  right: 22px;
  width: 65px;
  height: 65px;
  border: 2px solid #ffffffaa;
  border-radius: 50%;
  background: #123b2dcc;
  color: white;
  font-weight: bold;
  pointer-events: auto;
  touch-action: none;
}
#run { bottom: 45px; }
#carButton { bottom: 125px; }
#help {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  opacity: .8;
  white-space: nowrap;
}
</style>
</head>

<body>
<div id="hud">
  <div id="logo">🇧🇷 BRASIL RP</div>
  <div id="location">Nova Paraíba • Centro</div>
  <div id="status">PROTÓTIPO 0.1<br>ONLINE: TESTE LOCAL</div>
  <div id="message">Bem-vindo a Nova Paraíba!</div>

  <div id="controls">
    <div id="joystick"><div id="stick"></div></div>
    <button class="action" id="run">CORRER</button>
    <button class="action" id="carButton">ENTRAR</button>
    <div id="help">Joystick: mover • Arraste a tela: girar câmera</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

// CENA
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91d5f5);
scene.fog = new THREE.Fog(0x91d5f5, 45, 180);

const camera = new THREE.PerspectiveCamera(
  65, window.innerWidth / window.innerHeight, 0.1, 500
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ILUMINAÇÃO
scene.add(new THREE.HemisphereLight(0xffffff, 0x61745a, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(-35, 65, 35);
sun.castShadow = true;
scene.add(sun);

// MATERIAIS
const mat = (color) => new THREE.MeshStandardMaterial({ color });

// OBJETOS
function cube(name, x, y, z, sx, sy, sz, color) {
  const obj = new THREE.Mesh(
    new THREE.BoxGeometry(sx, sy, sz),
    mat(color)
  );
  obj.name = name;
  obj.position.set(x, y, z);
  obj.castShadow = true;
  obj.receiveShadow = true;
  scene.add(obj);
  return obj;
}

// TERRENO
cube("Terreno", 0, -0.6, 0, 200, 1, 200, 0x78a75a);

// RUAS E CALÇADAS
cube("Avenida principal", 0, -0.04, 0, 16, 0.12, 190, 0x34383d);
cube("Rua lateral", 0, 0.01, 0, 190, 0.12, 12, 0x34383d);
cube("Calçada", -10, 0.1, 0, 3, 0.2, 190, 0xb9b7a9);
cube("Calçada", 10, 0.1, 0, 3, 0.2, 190, 0xb9b7a9);

// FAIXA CENTRAL
for (let z = -85; z < 90; z += 12) {
  cube("Faixa", 0, 0.04, z, 0.22, 0.04, 5, 0xffffff);
}

// PRAÇA CENTRAL
cube("Praça central", -27, 0.05, 0, 25, 0.2, 30, 0xb5b18c);
cube("Fonte", -27, 0.6, 0, 4, 1, 4, 0x42b9d6);
cube("Água da fonte", -27, 1.15, 0, 3.3, 0.1, 3.3, 0x5dd7ed);

// PRÉDIOS
function building(name, x, z, w, h, d, color) {
  const b = cube(name, x, h/2, z, w, h, d, color);
  cube("Telhado", x, h + 0.15, z, w + 0.4, 0.3, d + 0.4, 0x454545);

  for (let y = 2; y < h - 1; y += 3) {
    for (let xx = -w/2 + 1.5; xx < w/2; xx += 3) {
      cube("Janela", x + xx, y, z - d/2 - 0.03, 1.1, 1.4, 0.08, 0x83cbe8);
    }
  }
  return b;
}

building("Mercado", -24, -24, 13, 7, 12, 0xe8c77b);
building("Delegacia", 25, -25, 15, 9, 13, 0xd5dce0);
building("Loja", -25, 26, 12, 6, 12, 0xe3a76f);
building("Casa", 24, 25, 12, 6, 12, 0xe7d1a5);
building("Prédio comercial", 40, -45, 15, 17, 14, 0xd1d6dc);
building("Casa", -42, -38, 13, 7, 13, 0xe7c49b);
building("Casa", 42, 42, 13, 7, 13, 0xc7d9b2);

// POSTO DE COMBUSTÍVEL
cube("Posto", 28, 0.1, 65, 25, 0.2, 23, 0x777777);
cube("Cobertura do posto", 28, 5, 65, 22, 0.7, 13, 0xe6d943);
cube("Coluna posto", 20, 2.5, 65, 0.8, 5, 0.8, 0xffffff);
cube("Coluna posto", 36, 2.5, 65, 0.8, 5, 0.8, 0xffffff);

// ÁRVORES
function tree(x, z) {
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.35, 0.5, 3, 8),
    mat(0x76502e)
  );
  trunk.position.set(x, 1.5, z);
  scene.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.SphereGeometry(2.1, 10, 8),
    mat(0x287b38)
  );
  leaves.position.set(x, 4, z);
  leaves.castShadow = true;
  scene.add(leaves);
}

for (let z = -85; z < 90; z += 13) {
  tree(-14, z);
  tree(14, z);
}
for (let x = -45; x < 50; x += 12) {
  tree(x, 18);
}

// PERSONAGEM
const player = new THREE.Group();
scene.add(player);

const body = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.45, 0.9, 4, 8),
  mat(0x1766bd)
);
body.position.y = 1.2;
body.castShadow = true;
player.add(body);

const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.32, 16, 12),
  mat(0xd69b70)
);
head.position.y = 2.05;
player.add(head);
  // POSTES DE ILUMINAÇÃO
function streetLight(x, z) {
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.09, 0.13, 7, 8),
    mat(0x555555)
  );
  pole.position.set(x, 3.5, z);
  scene.add(pole);

  const arm = new THREE.Mesh(
    new THREE.BoxGeometry(1.5, 0.12, 0.12),
    mat(0x555555)
  );
  arm.position.set(x + 0.6, 6.7, z);
  scene.add(arm);

  const lamp = new THREE.Mesh(
    new THREE.BoxGeometry(0.65, 0.16, 0.4),
    new THREE.MeshStandardMaterial({
      color: 0xfff2c0,
      emissive: 0x554422
    })
  );
  lamp.position.set(x + 1.15, 6.6, z);
  scene.add(lamp);
}

for (let z = -75; z <= 75; z += 25) {
  streetLight(-12, z);
  streetLight(12, z);
}

// BANCOS DA PRAÇA
function bench(x, z) {
  const seat = cube(
    "Banco da praça",
    x, 0.65, z,
    2.4, 0.18, 0.65,
    0x754321
  );

  cube("Encosto do banco", x, 1.15, z - 0.25,
    2.4, 0.8, 0.15, 0x754321);

  for (const dx of [-0.9, 0.9]) {
    cube("Pé do banco", x + dx, 0.3, z,
      0.15, 0.6, 0.15, 0x333333);
  }
}

bench(-32, -8);
bench(-22, -8);
bench(-32, 8);
bench(-22, 8);

// FAIXAS DE PEDESTRES
for (let i = 0; i < 7; i++) {
  cube(
    "Faixa de pedestres",
    -8 + i * 2.5,
    0.06,
    -12,
    1.3, 0.04, 3,
    0xffffff
  );
}

// PERNAS
const legs = [];
for (let x of [-0.22, 0.22]) {
  const leg = new THREE.Mesh(
    new THREE.BoxGeometry(0.22, 0.75, 0.25),
    mat(0x252b39)
  );
  leg.position.set(x, 0.48, 0);
  player.add(leg);
  legs.push(leg);
}
  // BRAÇOS DO PERSONAGEM
const arms = [];

for (const x of [-0.62, 0.62]) {
  const arm = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.13, 0.65, 4, 8),
    mat(0xd69b70)
  );
  arm.position.set(x, 1.25, 0);
  arm.rotation.z = x < 0 ? -0.12 : 0.12;
  arm.castShadow = true;
  player.add(arm);
  arms.push(arm);
}

// CABELO
const hair = new THREE.Mesh(
  new THREE.SphereGeometry(0.33, 16, 12),
  mat(0x25201d)
);
hair.scale.set(1, 0.55, 1);
hair.position.set(0, 2.25, 0);
player.add(hair);

// TÊNIS
for (const x of [-0.22, 0.22]) {
  const shoe = new THREE.Mesh(
    new THREE.BoxGeometry(0.28, 0.16, 0.42),
    mat(0xffffff)
  );
  shoe.position.set(x, 0.12, 0.08);
  player.add(shoe);
}

// GOL SIMPLIFICADO
const car = new THREE.Group();
scene.add(car);
car.position.set(5, 0, 8);

const carBody = new THREE.Mesh(
  new THREE.BoxGeometry(2.2, 0.8, 4.2),
  mat(0xd92323)
);
carBody.position.y = 0.85;
carBody.castShadow = true;
car.add(carBody);

const cabin = new THREE.Mesh(
  new THREE.BoxGeometry(1.85, 0.85, 2.1),
  mat(0x9cc8d8)
);
cabin.position.set(0, 1.55, -0.2);
car.add(cabin);

// RODAS
const wheels = [];
for (const x of [-1.1, 1.1]) {
  for (const z of [-1.35, 1.35]) {
    const wheel = new THREE.Mesh(
      new THREE.CylinderGeometry(0.42, 0.42, 0.25, 16),
      mat(0x171717)
    );
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(x, 0.45, z);
    car.add(wheel);
    wheels.push(wheel);
  }
}

let driving = false;
let carSpeed = 0;
let running = false;
let cameraAngle = 0;
let cameraPitch = 0.25;
let moveX = 0;
let moveY = 0;
let joystickActive = false;
let lastTouchX = null;
let lastTouchY = null;

const message = document.getElementById("message");
const carButton = document.getElementById("carButton");

function say(text) {
  message.textContent = text;
  message.style.display = "block";
  clearTimeout(say.timer);
  say.timer = setTimeout(() => {
    message.style.display = "none";
  }, 2500);
}
// DETALHES DO VOLKSWAGEN GOL

// Para-choques
for (const z of [-2.12, 2.12]) {
  const bumper = new THREE.Mesh(
    new THREE.BoxGeometry(2.25, 0.22, 0.18),
    mat(0x222222)
  );
  bumper.position.set(0, 0.55, z);
  car.add(bumper);
}

// Faróis dianteiros
for (const x of [-0.72, 0.72]) {
  const light = new THREE.Mesh(
    new THREE.BoxGeometry(0.48, 0.28, 0.08),
    new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0x777777
    })
  );
  light.position.set(x, 0.95, 2.13);
  car.add(light);
}

// Lanternas traseiras
for (const x of [-0.72, 0.72]) {
  const light = new THREE.Mesh(
    new THREE.BoxGeometry(0.42, 0.35, 0.08),
    mat(0xc90000)
  );
  light.position.set(x, 0.95, -2.13);
  car.add(light);
}

// Retrovisores
for (const x of [-1.08, 1.08]) {
  const mirror = new THREE.Mesh(
    new THREE.BoxGeometry(0.22, 0.2, 0.3),
    mat(0x202020)
  );
  mirror.position.set(x, 1.45, 0.65);
  car.add(mirror);
}

// GRADE DIANTEIRA
const grille = new THREE.Mesh(
  new THREE.BoxGeometry(0.85, 0.16, 0.06),
  mat(0x171717)
);
grille.position.set(0, 0.82, 2.16);
car.add(grille);

// PLACA
const plate = new THREE.Mesh(
  new THREE.BoxGeometry(0.65, 0.18, 0.04),
  mat(0xffffff)
);
plate.position.set(0, 0.57, 2.23);
car.add(plate);
  
// JOYSTICK
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

function joystickMove(e) {
  const rect = joystick.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let dx = e.clientX - cx;
  let dy = e.clientY - cy;
  const max = 38;
  const length = Math.hypot(dx, dy);

  if (length > max) {
    dx = dx / length * max;
    dy = dy / length * max;
  }

  stick.style.transform = `translate(${dx}px, ${dy}px)`;
  moveX = dx / max;
  moveY = dy / max;
}

joystick.addEventListener("pointerdown", e => {
  joystickActive = true;
  joystick.setPointerCapture(e.pointerId);
  joystickMove(e);
});

joystick.addEventListener("pointermove", e => {
  if (joystickActive) joystickMove(e);
});

function resetJoystick() {
  joystickActive = false;
  moveX = 0;
  moveY = 0;
  stick.style.transform = "translate(0,0)";
}

joystick.addEventListener("pointerup", resetJoystick);
joystick.addEventListener("pointercancel", resetJoystick);

// CORRER
document.getElementById("run").addEventListener("pointerdown", () => {
  running = true;
});
document.getElementById("run").addEventListener("pointerup", () => {
  running = false;
});
document.getElementById("run").addEventListener("pointercancel", () => {
  running = false;
});

// CÂMERA POR ARRASTE
renderer.domElement.addEventListener("pointerdown", e => {
  lastTouchX = e.clientX;
  lastTouchY = e.clientY;
});

renderer.domElement.addEventListener("pointermove", e => {
  if (lastTouchX === null) return;

  const dx = e.clientX - lastTouchX;
  const dy = e.clientY - lastTouchY;

  cameraAngle -= dx * 0.006;
  cameraPitch = THREE.MathUtils.clamp(
    cameraPitch + dy * 0.003, 0.08, 0.65
  );

  lastTouchX = e.clientX;
  lastTouchY = e.clientY;
});

renderer.domElement.addEventListener("pointerup", () => {
  lastTouchX = null;
  lastTouchY = null;
});
renderer.domElement.addEventListener("pointercancel", () => {
  lastTouchX = null;
  lastTouchY = null;
});

// ENTRAR E SAIR DO GOL
carButton.addEventListener("click", () => {
  if (!driving && player.position.distanceTo(car.position) < 6) {
    driving = true;
    player.visible = false;
    carButton.textContent = "SAIR";
    say("Você entrou no Volkswagen Gol!");
  } else if (driving) {
    driving = false;
    player.visible = true;
    player.position.copy(car.position);
    player.position.x += 2.5;
    carButton.textContent = "ENTRAR";
    say("Você saiu do veículo.");
  } else {
    say("Chegue mais perto do Gol para entrar.");
  }
});

// MOVIMENTO
const clock = new THREE.Clock();
const direction = new THREE.Vector3();
const cameraTarget = new THREE.Vector3();

function update(dt) {
  if (!driving) {
    const speed = running ? 8 : 4.5;

    direction.set(
      moveX,
      0,
      moveY
    );

    if (direction.length() > 0.1) {
      direction.normalize();

      const forward = new THREE.Vector3(
        -Math.sin(cameraAngle), 0, -Math.cos(cameraAngle)
      );
      const right = new THREE.Vector3(
        Math.cos(cameraAngle), 0, -Math.sin(cameraAngle)
      );

      const movement = new THREE.Vector3()
        .addScaledVector(right, direction.x)
        .addScaledVector(forward, -direction.z);

      if (movement.length() > 0) {
        movement.normalize();
        player.position.addScaledVector(movement, speed * dt);
        player.rotation.y = Math.atan2(movement.x, movement.z);
      }
    }

    const moving = Math.abs(moveX) + Math.abs(moveY) > 0.1;
    legs.forEach((leg, i) => {
      leg.rotation.x = moving
        ? Math.sin(clock.elapsedTime * 10 + i * Math.PI) * 0.5
        : 0;
    });

    player.position.x = THREE.MathUtils.clamp(player.position.x, -85, 85);
    player.position.z = THREE.MathUtils.clamp(player.position.z, -85, 85);

  } else {
    const acceleration = -moveY;
    carSpeed += acceleration * 9 * dt;
    carSpeed *= Math.pow(0.97, dt * 60);
    carSpeed = THREE.MathUtils.clamp(carSpeed, -8, 22);

    car.rotation.y -= moveX * carSpeed * 0.035 * dt * 10;

    const forward = new THREE.Vector3(
      Math.sin(car.rotation.y), 0, Math.cos(car.rotation.y)
    );

    car.position.addScaledVector(forward, carSpeed * dt);

    wheels.forEach(w => w.rotation.x += carSpeed * dt * 1.5);
  }

  const target = driving ? car.position : player.position;

  const distance = driving ? 10 : 7;
  const height = driving ? 4.5 : 3.4;

  const offset = new THREE.Vector3(
    Math.sin(cameraAngle) * distance,
    height + cameraPitch * 5,
    Math.cos(cameraAngle) * distance
  );

  camera.position.lerp(
    target.clone().add(offset),
    1 - Math.pow(0.001, dt)
  );

  cameraTarget.copy(target);
  cameraTarget.y += driving ? 1.1 : 1.5;
  camera.lookAt(cameraTarget);
}

// INÍCIO DA CÂMERA
camera.position.set(0, 5, 9);
camera.lookAt(0, 1, 0);

// LOOP
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
}
animate();

// REDIMENSIONAMENTO
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
